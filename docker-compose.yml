services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    networks: [ internal ]

  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    networks: [ internal ]

  web:
    image: nginx:1.27
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - app
    networks: [ internal ]

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
    networks: [ internal ]

networks:
  internal:
    driver: bridge
